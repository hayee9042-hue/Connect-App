<!doctype html>
<html lang="en">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/0c441e3550.js" crossorigin="anonymous"></script>
    <style>
        img {
            width: 630px;
            position: absolute;
            float: right;
        }

        .img1 {
            animation: show1 9s infinite;
        }

        .img2 {
            animation: show2 9s infinite;
        }

        .img3 {
            animation: show3 9s infinite;
        }

        @keyframes show1 {

            0%,
            33.33% {
                visibility: visible;
            }

            33.34%,
            100% {
                visibility: hidden;
            }
        }

        @keyframes show2 {

            0%,
            33.33% {
                visibility: hidden;
            }

            33.34%,
            66.66% {
                visibility: visible;
            }

            66.67%,
            100% {
                visibility: hidden;
            }

        }

        @keyframes show3 {

            0%,
            66.66% {
                visibility: hidden;
            }

            66.67%,
            100% {
                visibility: visible;
            }

        }
    </style>
</head>

<body class="bg-light">
    <div class="row" style="width: 100%;">
        <div class="col-6">
            <div class="container-fluid">
                <i class="fa-brands fa-facebook mt-5" style="color: #0460d8; float: left; font-size: 90px;"></i>
                <img src="Images/side.png" alt="Image1" class="img1">
                <img src="Images/side2.png" alt="Image2" class="img2">
                <img src="Images/side3.png" alt="Image2" class="img3">
                <br><br><br><br><br><br><br><br><br><br><br>
                <p class="text-secondary fs-1"><b>Explore <br> the <br> things <br> <span class="text-primary">you love</span>.</b></p>
            </div>
        </div>
        <div class="col-6">
            <div class="form1 position-center mx-5 pt-5">
                <form action="#">
                    <h1 class="text-center text-primary">Sign Up</h1>
                    <div class="form-group">
                        <label class="form-label">Enter Your Name:</label>
                        <input class="form-control" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Enter Your Email:</label>
                        <input class="form-control" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Create a Strong Password:</label>
                        <input class="form-control" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password:</label>
                        <input class="form-control" />
                    </div>

                    <button type="button" class="btn btn-primary mt-3">Sign Up</button>
                    <button class="btn btn-outline-primary mt-3 btn-1">
                        Already have an account?
                    </button>
                </form>
            </div>

            <div class="form2 position-center mx-5 pt-5">
                <form action="#">
                    <h1 class="text-center text-primary">Log In</h1>
                    <div class="form-group">
                        <label class="form-label">Enter Your Email:</label>
                        <input class="form-control" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Enter Your Password:</label>
                        <input class="form-control" />
                    </div>
                    <button type="button" class="btn btn-primary mt-3">Log In</button>
                    <button class="btn btn-outline-primary mt-3 btn-2">
                        Don't have an account?
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $(".form2").hide();
            $(".btn-1").click(function () {
                $(".form2").show();
                $(".form1").hide();
            });
            $(".btn-2").click(function () {
                $(".form1").show();
                $(".form2").hide();
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
</body>

</html>
